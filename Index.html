<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Buscador de Libros</h1>

        <input type="text" id="searchInput" placeholder="Escribe el título del libro">
        <button onclick="searchBooks()">Buscar</button>

        <div id="results"></div>

        <div class="pagination">
            <button id="prevBtn" onclick="prevPage()" disabled>Anterior</button>
            <span id="pageNumber">Página 1</span>
            <button id="nextBtn" onclick="nextPage()" disabled>Siguiente</button>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
